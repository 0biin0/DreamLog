version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamlog-db
    environment:
      POSTGRES_DB: dreamlog
      POSTGRES_USER: dreamlog_user
      POSTGRES_PASSWORD: dreamlog_pass
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - dreamlog-data:/var/lib/postgresql/data

volumes:
  dreamlog-data:
